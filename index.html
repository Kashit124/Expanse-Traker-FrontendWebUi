<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CashBook Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-p-0 font-sans">

    <!-- Navbar -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">CashBook Manager</h1>
        <button id="logout-btn" class="bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-lg text-sm hover:bg-red-500 hover:text-white transition">
            <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
        </button>
    </nav>

    <div class="max-w-6xl mx-auto p-6 space-y-6">

        <!-- Top Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Current Balance</p>
                <h2 id="summary-balance" class="text-3xl font-bold mt-2 text-blue-400">$0.00</h2>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Total Income</p>
                <h2 id="summary-income" class="text-3xl font-bold mt-2 text-emerald-400">$0.00</h2>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Total Expenses</p>
                <h2 id="summary-expense" class="text-3xl font-bold mt-2 text-rose-400">$0.00</h2>
            </div>
        </div>

        <!-- Account Section Header -->
        <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div class="flex items-center space-x-4">
                <label class="text-sm font-semibold text-slate-300">Select Account:</label>
                <select id="account-select" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    <option value="">Loading accounts...</option>
                </select>
            </div>
            <button onclick="openAccountModal()" class="bg-blue-600 hover:bg-blue-500 text-sm font-semibold px-4 py-2 rounded-lg transition shadow-md">
                <i class="fa-solid fa-plus mr-1"></i> New Account
            </button>
        </div>

        <!-- Transactions Section -->
        <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-lg">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-lg">Transactions</h3>
                <button onclick="openTransactionModal()" class="bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold px-4 py-2 rounded-lg transition">
                    <i class="fa-solid fa-plus mr-1"></i> Add Transaction
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                            <th class="p-4">Date</th>
                            <th class="p-4">Category</th>
                            <th class="p-4">Description</th>
                            <th class="p-4">Type</th>
                            <th class="p-4 text-right">Amount</th>
                            <th class="p-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-table-body" class="divide-y divide-slate-700 text-sm">
                        <tr><td colspan="6" class="p-6 text-center text-slate-400">Select an account to view transactions.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modals (Account & Transaction Creation) -->
    <!-- Account Modal -->
    <div id="account-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Create New Account</h3>
            <form id="account-form" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Account Name</label>
                    <input type="text" id="acc-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Opening Balance ($)</label>
                    <input type="number" step="0.01" id="acc-balance" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:border-blue-500 focus:outline-none">
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="closeAccountModal()" class="px-4 py-2 bg-slate-700 rounded-lg text-sm hover:bg-slate-600">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 rounded-lg text-sm hover:bg-blue-500 font-semibold">Save Account</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Transaction Modal -->
    <div id="transaction-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h3 id="tx-modal-title" class="text-lg font-bold mb-4">Add Transaction</h3>
            <form id="transaction-form" class="space-y-4">
                <input type="hidden" id="tx-id">
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Type</label>
                    <select id="tx-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:border-blue-500 focus:outline-none">
                        <option value="EXPENSE">Expense</option>
                        <option value="INCOME">Income</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Amount ($)</label>
                    <input type="number" step="0.01" id="tx-amount" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Category</label>
                    <input type="text" id="tx-category" required placeholder="e.g. Food, Salary" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Description</label>
                    <input type="text" id="tx-desc" placeholder="Optional notes" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:border-blue-500 focus:outline-none">
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="closeTransactionModal()" class="px-4 py-2 bg-slate-700 rounded-lg text-sm hover:bg-slate-600">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 rounded-lg text-sm hover:bg-indigo-500 font-semibold">Save Transaction</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
